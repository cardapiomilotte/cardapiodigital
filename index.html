<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cardápio Milotte Cookie</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600&display=swap">
<style>
/* Layout: uma tela só. Sabores em lista com contador direto; o pedido fica fixo à direita no computador e abre em tela cheia no celular. */
:root {
  --bg: #FBEDE0;          /* creme do logo */
  --surface: #FFF9F3;     /* papel: pedido, campos */
  --ink: #3B2414;         /* texto */
  --ink-soft: #7B604D;    /* texto de apoio */
  --brand: #5F381B;       /* chocolate do logo */
  --on-brand: #FBEDE0;
  --gold: #C0A280;        /* filete do logo */
  --rule: #E9D5C1;
  --ok: #2F6B3F;
  --warn: #9A3B1E;
  --warn-bg: #F7DCCB;
  --zap: #1F7A4D;         /* botão do WhatsApp */
  --on-zap: #FFFFFF;
  --f-display: "Cormorant Garamond", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --f-text: "Jost", "Avenir Next", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1B120C; --surface: #271A12; --ink: #F3E3D2; --ink-soft: #C2A993; --brand: #E9CFAE; --on-brand: #2A1A0F;
    --gold: #B39470; --rule: #3D2B1F; --ok: #8FCB9C; --warn: #F0A988; --warn-bg: #4A2416; --zap: #2E9B63; --on-zap: #FFFFFF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1B120C; --surface: #271A12; --ink: #F3E3D2; --ink-soft: #C2A993; --brand: #E9CFAE; --on-brand: #2A1A0F;
  --gold: #B39470; --rule: #3D2B1F; --ok: #8FCB9C; --warn: #F0A988; --warn-bg: #4A2416; --zap: #2E9B63; --on-zap: #FFFFFF;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-text); font-size: 1rem; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body.travado { overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button, a, label, input, select, textarea { touch-action: manipulation; }
button, a, label { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
h1, h2, h3, p, ul, ol, dl { margin: 0; }
ul, ol { padding: 0; list-style: none; }

.demo { background: var(--warn-bg); color: var(--ink); font-size: 0.875rem; padding: 0.625rem 1rem; text-align: center; }
.demo strong { font-weight: 600; }

.pagina { max-width: 68rem; margin-inline: auto; padding-inline: 1rem; padding-block: 0 6.5rem; }

/* ---------- topo ---------- */
.topo { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 0.75rem 2rem; padding-block: 1.1rem 0.9rem; border-bottom: 1px solid var(--rule); }
.marca { display: inline-flex; flex-direction: column; align-items: stretch; color: var(--brand); }
.marca-nome { font-family: var(--f-display); font-weight: 500; font-size: clamp(2.5rem, 10vw, 4.25rem); line-height: 0.95; letter-spacing: 0.01em; display: flex; align-items: baseline; }
.marca-nome svg { width: 0.62em; height: 0.62em; margin-inline: 0.03em; align-self: flex-end; margin-bottom: 0.07em; flex: none; }
.marca-sub { display: flex; align-items: center; gap: 0.75rem; margin-top: 0.35rem; font-size: 0.6875rem; font-weight: 500; letter-spacing: 0.52em; text-indent: 0.52em; text-transform: uppercase; }
.marca-sub::before, .marca-sub::after { content: ""; flex: 1; height: 1px; background: var(--gold); }
.info { display: flex; flex-wrap: wrap; gap: 0.1rem 1rem; font-size: 0.8125rem; color: var(--ink-soft); max-width: 34rem; }
.info li { display: inline-flex; align-items: center; gap: 0.4rem; }
.info .estado { color: var(--ink); font-weight: 500; }
.ponto { width: 0.55rem; height: 0.55rem; border-radius: 50%; background: var(--warn); flex: none; }
.ponto.aberto { background: var(--ok); }

/* ---------- colunas ---------- */
.colunas { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2.5rem; }
.cardapio { min-width: 0; }
.cat { padding-top: 1.25rem; }
.cat h2 { display: flex; align-items: center; gap: 0.875rem; font-size: 0.8125rem; font-weight: 500; letter-spacing: 0.34em; text-transform: uppercase; color: var(--brand); }
.cat h2::before, .cat h2::after { content: ""; flex: 1; height: 1px; background: var(--gold); }
.cat h2::before { flex: 0 0 1.5rem; }
.atalhos { display: flex; flex-wrap: wrap; gap: 0.5rem; padding-top: 0.875rem; }
.atalho { border: 1px solid var(--gold); background: transparent; color: var(--brand); border-radius: 999px; padding: 0.55rem 0.95rem; font-size: 0.875rem; font-weight: 500; }
.atalho:hover { border-color: var(--brand); }
.atalhos:empty { display: none; }

.grade { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.5rem 0.875rem; padding-top: 1rem; }
.item { display: flex; flex-direction: column; gap: 0.5rem; min-width: 0; }
.foto { position: relative; display: block; width: 100%; max-width: 100%; aspect-ratio: 1; padding: 0; border: 0; background: var(--rule); border-radius: 1.125rem; }
.foto img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }
.foto .qtd { position: absolute; top: 0.5rem; right: 0.5rem; min-width: 2rem; height: 2rem; padding-inline: 0.45rem; border-radius: 999px; background: var(--brand); color: var(--on-brand); font-size: 1rem; font-weight: 600; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--bg); font-variant-numeric: tabular-nums; }
.item-texto { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 0.2rem; }
.item-nome { font-family: var(--f-display); font-weight: 600; font-size: 1.375rem; line-height: 1.1; color: var(--brand); }
.item-desc { font-size: 0.8125rem; line-height: 1.4; color: var(--ink-soft); }
.item-base { display: flex; flex-direction: column; gap: 0.4rem; }
.preco { font-weight: 600; font-size: 1.0625rem; font-variant-numeric: tabular-nums; }

.mais, .passo button { width: 2.75rem; height: 2.75rem; border-radius: 50%; border: 1px solid var(--brand); background: transparent; color: var(--brand); font-size: 1.375rem; line-height: 1; display: inline-grid; place-items: center; flex: none; }
.mais { background: var(--brand); color: var(--on-brand); width: 100%; border-radius: 999px; padding-inline: 0.75rem; font-size: 0.9375rem; font-weight: 600; }
.passo { display: flex; align-items: center; justify-content: space-between; gap: 0.25rem; width: 100%; }
.passo output { flex: 1; min-width: 1.75rem; text-align: center; font-weight: 600; font-size: 1.0625rem; font-variant-numeric: tabular-nums; }
.passo.pequeno { display: inline-flex; width: auto; }
.passo.pequeno button { width: 2.5rem; height: 2.5rem; font-size: 1.25rem; }
.passo, .mais, .foto, .botao, .atalho { -webkit-user-select: none; user-select: none; }

/* ---------- pedido ---------- */
.sacola { display: none; background: var(--surface); }
.sacola.aberta { display: block; position: fixed; inset: 0; z-index: 20; overflow-y: auto; padding: calc(1rem + env(safe-area-inset-top, 0px)) 1rem 0; }
.sacola-topo { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 0.5rem; }
.sacola-topo h2 { font-family: var(--f-display); font-weight: 600; font-size: 1.625rem; line-height: 1.15; color: var(--brand); min-width: 0; }
.link { background: none; border: 0; padding: 0.5rem 0; color: var(--brand); text-decoration: underline; text-underline-offset: 0.2em; font-size: 0.9375rem; white-space: nowrap; }
.bloco { display: flex; flex-direction: column; gap: 0.9rem; }
.sub { font-size: 0.75rem; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: var(--brand); padding-top: 0.6rem; border-top: 1px solid var(--rule); }
.vazio { color: var(--ink-soft); padding-block: 1.25rem; display: flex; flex-direction: column; align-items: flex-start; gap: 0.75rem; }
.vazio svg { width: 3.5rem; height: 3.5rem; opacity: 0.7; color: var(--brand); }

.linhas { display: flex; flex-direction: column; }
.linha { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.25rem 0.75rem; align-items: center; padding-block: 0.6rem; border-bottom: 1px solid var(--rule); }
.linha:last-child { border-bottom: 0; }
.linha-nome { font-weight: 500; }
.linha-preco { color: var(--ink-soft); font-size: 0.9375rem; font-variant-numeric: tabular-nums; }
.totais { display: grid; grid-template-columns: 1fr auto; gap: 0.3rem 1rem; font-variant-numeric: tabular-nums; padding-top: 0.6rem; border-top: 1px solid var(--rule); }
.totais dt, .totais dd { margin: 0; }
.totais dt { color: var(--ink-soft); }
.totais dd { text-align: right; }
.fecho { position: sticky; bottom: 0; z-index: 2; display: flex; flex-direction: column; gap: 0.5rem; background: var(--surface); border-top: 1px solid var(--rule); margin-inline: -1rem; padding: 0.75rem 1rem calc(0.75rem + env(safe-area-inset-bottom, 0px)); }
.total-linha { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; font-weight: 600; font-size: 1.125rem; font-variant-numeric: tabular-nums; }

.campo { display: flex; flex-direction: column; gap: 0.3rem; }
.campo label { font-size: 0.8125rem; font-weight: 500; letter-spacing: 0.06em; color: var(--ink-soft); }
.campo input, .campo textarea, .campo select { width: 100%; background: var(--bg); border: 1px solid var(--rule); border-radius: 0.375rem; padding: 0.7rem 0.8rem; font-size: 1rem; }
.campo input:focus, .campo textarea:focus, .campo select:focus { border-color: var(--brand); outline: none; box-shadow: 0 0 0 1px var(--brand); }
.campo [aria-invalid="true"] { border-color: var(--warn); box-shadow: 0 0 0 1px var(--warn); }
.dupla { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 0.75rem; }
.erro { color: var(--warn); font-size: 0.9375rem; font-weight: 500; }
.nota { color: var(--ink-soft); font-size: 0.9375rem; }
.aviso { background: var(--warn-bg); border-radius: 0.375rem; padding: 0.7rem 0.8rem; font-size: 0.9375rem; }
.troca { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--brand); border-radius: 999px; padding: 0.2rem; }
.troca label { text-align: center; padding: 0.55rem 0.5rem; border-radius: 999px; cursor: pointer; font-weight: 500; color: var(--brand); }
.troca input { position: absolute; opacity: 0; pointer-events: none; }
.troca label:has(input:checked) { background: var(--brand); color: var(--on-brand); }
.troca label:has(input:focus-visible) { outline: 2px solid var(--brand); outline-offset: 2px; }

.botao { display: inline-flex; align-items: center; justify-content: center; gap: 0.6rem; width: 100%; min-height: 3.25rem; padding: 0.75rem 1.25rem; border-radius: 999px; border: 1px solid var(--brand); background: var(--brand); color: var(--on-brand); font-weight: 600; font-size: 1rem; text-decoration: none; text-align: center; }
.botao.vazado { background: transparent; color: var(--brand); }
.botao.zap { background: var(--zap); border-color: var(--zap); color: var(--on-zap); min-height: 3.5rem; font-size: 1.0625rem; }
.botao.zap svg { width: 1.35rem; height: 1.35rem; flex: none; }
.acoes { display: flex; flex-direction: column; gap: 0.5rem; }
.previa { white-space: pre-wrap; background: var(--bg); border: 1px solid var(--rule); border-radius: 0.375rem; padding: 0.75rem 0.8rem; font-size: 0.875rem; line-height: 1.45; margin: 0; font-family: var(--f-text); overflow-wrap: anywhere; }
.numero { font-weight: 600; user-select: all; font-variant-numeric: tabular-nums; }

/* ---------- barra fixa (celular) ---------- */
.barra { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 0.75rem 1rem calc(0.75rem + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 70%, transparent); }
.barra .botao { justify-content: space-between; box-shadow: 0 0.5rem 1.5rem -0.75rem var(--brand); }
.barra .botao { padding-inline: 1.1rem; gap: 0.75rem; }
.barra .botao span { white-space: nowrap; }
@media (max-width: 22rem) { .barra .botao { font-size: 0.9375rem; padding-inline: 1rem; } }
.barra .conta { font-variant-numeric: tabular-nums; }

/* ---------- rodapé ---------- */
.rodape { margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--rule); display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 1.5rem 2.5rem; font-size: 0.9375rem; color: var(--ink-soft); }
.rodape h2 { font-size: 0.75rem; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: var(--brand); margin-bottom: 0.5rem; }
.rodape ol { list-style: decimal; padding-left: 1.2rem; }
.horas { display: grid; grid-template-columns: auto 1fr; gap: 0.15rem 1.25rem; font-variant-numeric: tabular-nums; }
.horas dt, .horas dd { margin: 0; }
.horas .hoje { color: var(--ink); font-weight: 500; }

@media (min-width: 60rem) {
  .pagina { padding-block: 0 3rem; }
  .colunas { grid-template-columns: minmax(0, 1fr) 24rem; gap: 3.5rem; align-items: start; }
  .sacola, .sacola.aberta { display: block; position: sticky; inset: auto; top: calc(env(safe-area-inset-top, 0px) + 1.25rem); z-index: 1; max-height: calc(100vh - 2.5rem); overflow-y: auto; margin-top: 1.5rem; padding: 1.25rem 1.25rem 0; border: 1px solid var(--rule); border-radius: 0.5rem; }
  .fecho { margin-inline: -1.25rem; padding: 0.75rem 1.25rem 1rem; }
  .vazio { padding-bottom: 1.5rem; }
  .so-celular, .barra { display: none !important; }
  body.travado { overflow: auto; }
  .topo { padding-block: 1.75rem 1.25rem; }
  .marca-sub { font-size: 0.8125rem; margin-top: 0.5rem; }
  .info { font-size: 0.9375rem; gap: 0.25rem 1.25rem; }
  .grade { gap: 2rem 1.25rem; }
  .item-nome { font-size: 1.5rem; }
  .item-desc { font-size: 0.875rem; }
}
@media (min-width: 36rem) { .grade { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (prefers-reduced-motion: no-preference) {
  .mais, .botao, .passo button, .foto { transition: transform 0.12s ease; }
  .mais:active, .botao:active, .passo button:active, .foto:active { transform: scale(0.97); }
}
</style>

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const reais = (c) => "R$ " + (c / 100).toFixed(2).replace(".", ",").replace(/\B(?=(\d{3})+(?!\d))/g, ".");
const soDigitos = (s) => String(s || "").replace(/\D/g, "");
const produto = (id) => LOJA.produtos.find((p) => p.id === id);
const disponiveis = () => LOJA.produtos.filter((p) => p.disponivel !== false);
const plural = (n, um, varios) => n + " " + (n === 1 ? um : varios);

function foneLoja() { const d = soDigitos(LOJA.whatsapp); return !d ? "" : d.length <= 11 ? "55" + d : d; }
function foneBonito() {
  const d = foneLoja().slice(2);
  if (d.length === 11) return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
  if (d.length === 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;
  return d;
}
const TEM_ZAP = !!foneLoja();
const ICONE_ZAP = `<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" d="M12 3.5a8.5 8.5 0 0 0-7.4 12.7L3.5 20.5l4.4-1.1A8.5 8.5 0 1 0 12 3.5z"/><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" d="M8.5 10.5h7M8.5 13.5h4.5"/></svg>`;

/* ---------------------------- horários ------------------------------ */
const DIAS = ["dom", "seg", "ter", "qua", "qui", "sex", "sab"];
const DIAS_NOME = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];
const minutos = (hhmm) => { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; };
const horaCurta = (hhmm) => { const [h, m] = hhmm.split(":"); return Number(h) + "h" + (m === "00" ? "" : m); };
function agora() {
  try {
    const partes = new Intl.DateTimeFormat("en-US", { timeZone: LOJA.fuso, weekday: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(new Date());
    const m = Object.fromEntries(partes.map((p) => [p.type, p.value]));
    return { dia: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].indexOf(m.weekday), min: Number(m.hour) * 60 + Number(m.minute) };
  } catch (e) { const d = new Date(); return { dia: d.getDay(), min: d.getHours() * 60 + d.getMinutes() }; }
}
function situacao() {
  if (!LOJA.horarios) return null;
  const { dia, min } = agora();
  const h = LOJA.horarios[DIAS[dia]];
  if (h && min >= minutos(h[0]) && min < minutos(h[1])) return { aberto: true, texto: `Aberto agora, até ${horaCurta(h[1])}`, dia };
  if (h && min < minutos(h[0])) return { aberto: false, texto: `Fechado agora, abre hoje às ${horaCurta(h[0])}`, dia };
  for (let i = 1; i <= 7; i++) {
    const d = (dia + i) % 7, p = LOJA.horarios[DIAS[d]];
    if (p) return { aberto: false, texto: `Fechado agora, abre ${i === 1 ? "amanhã" : DIAS_NOME[d].toLowerCase()} às ${horaCurta(p[0])}`, dia };
  }
  return { aberto: false, texto: "Fechado", dia };
}

// Cookie mordido no traço do logo (marca e pedido vazio).
function cookieSvg() {
  const R = 40, c = 50, pt = (g) => { const a = g * Math.PI / 180; return [(c + R * Math.cos(a)).toFixed(2), (c + R * Math.sin(a)).toFixed(2)]; };
  const [a, b, d, e] = [-78, -54, -30, -6].map(pt), r = 9.2;
  const forma = `M${a} A${r} ${r} 0 0 0 ${b} A${r} ${r} 0 0 0 ${d} A${r} ${r} 0 0 0 ${e} A${R} ${R} 0 1 1 ${a}Z`;
  return `<svg viewBox="0 0 100 100" aria-hidden="true" focusable="false"><path d="${forma}" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linejoin="round"/>` +
    [[36, 34, 4.6], [58, 49, 3.6], [33, 58, 4.4], [50, 70, 4.4], [69, 64, 3.8]].map(([x, y, rr]) => `<circle cx="${x}" cy="${y}" r="${rr}" fill="currentColor"/>`).join("") + `</svg>`;
}

/* ------------------------------ estado ------------------------------ */
const CHAVE = "milotte-cardapio-v2";
const novoId = () => "ML" + Date.now().toString(36).toUpperCase().slice(-5);
const estado = { itens: {}, obs: "", nome: "", modo: "entrega", rua: "", numero: "", bairro: "", compl: "", pagamento: "pix", ultimo: null, pedidoId: novoId(), erro: "", faltando: [], enviado: false, aberta: false };
function itensValidos(obj) {
  const out = {};
  if (obj && typeof obj === "object") for (const [id, q] of Object.entries(obj)) if (produto(id) && produto(id).disponivel !== false && q > 0) out[id] = Math.min(99, Math.floor(q));
  return out;
}
try {
  const salvo = JSON.parse(localStorage.getItem(CHAVE) || "null");
  if (salvo && typeof salvo === "object") {
    for (const k of ["obs", "nome", "rua", "numero", "bairro", "compl"]) if (typeof salvo[k] === "string") estado[k] = salvo[k];
    if (salvo.modo === "retirada" || salvo.modo === "entrega") estado.modo = salvo.modo;
    if (salvo.pagamento === "pix" || salvo.pagamento === "cartao") estado.pagamento = salvo.pagamento;
    estado.itens = itensValidos(salvo.itens);
    const u = itensValidos(salvo.ultimo);
    estado.ultimo = Object.keys(u).length ? u : null;
  }
} catch (e) { /* sem armazenamento: segue em memória */ }
function salvar() {
  try { localStorage.setItem(CHAVE, JSON.stringify({ itens: estado.itens, obs: estado.obs, nome: estado.nome, modo: estado.modo, rua: estado.rua, numero: estado.numero, bairro: estado.bairro, compl: estado.compl, pagamento: estado.pagamento, ultimo: estado.ultimo })); } catch (e) { /* ignora */ }
}
if (!LOJA.entrega.retirada) estado.modo = "entrega";
const BAIRROS = Array.isArray(LOJA.entrega.bairros) ? LOJA.entrega.bairros : [];
if (BAIRROS.length && !BAIRROS.some((b) => b.nome === estado.bairro)) estado.bairro = "";

function contas() {
  const linhas = Object.entries(estado.itens).map(([id, qtd]) => { const p = produto(id); return { id, nome: p.nome, qtd, unit: p.preco, total: p.preco * qtd }; });
  const subtotal = linhas.reduce((s, l) => s + l.total, 0);
  const unidades = linhas.reduce((s, l) => s + l.qtd, 0);
  let taxa = 0;                                   // retirada
  if (estado.modo === "entrega") {
    const b = BAIRROS.find((x) => x.nome === estado.bairro);
    taxa = BAIRROS.length ? (b ? b.taxa : null) : LOJA.entrega.taxa;      // null = a confirmar
  }
  return { linhas, subtotal, unidades, taxa, total: subtotal + (taxa || 0) };
}

/* --------------------------- mensagem ------------------------------- */
function textoPedido() {
  const c = contas(), entrega = estado.modo === "entrega";
  const end = `${estado.rua.trim()}, ${estado.numero.trim()}, ${estado.bairro.trim()}${estado.compl.trim() ? " (" + estado.compl.trim() + ")" : ""}`;
  return [
    `*Novo pedido ${estado.pedidoId}* | ${LOJA.nome}`,
    "",
    ...c.linhas.map((l) => `${l.qtd}x ${l.nome} | ${reais(l.total)}`),
    ...(estado.obs.trim() ? ["Obs.: " + estado.obs.trim()] : []),
    "",
    `Subtotal: ${reais(c.subtotal)}`,
    ...(entrega ? [c.taxa === null ? "Entrega: taxa a confirmar" : `Entrega: ${reais(c.taxa)}`] : []),
    c.taxa === null ? `*Total: ${reais(c.subtotal)} + entrega*` : `*Total: ${reais(c.total)}*`,
    "",
    `Nome: ${estado.nome.trim()}`,
    entrega ? `Entregar em: ${end}` : "Retirada na loja",
    estado.pagamento === "pix" ? "Pagamento: Pix. Pode me enviar a chave?" : "Pagamento: cartão. Pode me enviar o link?"
  ].join("\n");
}
const linkZap = () => `https://wa.me/${foneLoja()}?text=${encodeURIComponent(textoPedido())}`;
function faltando() {
  const f = [];
  if (estado.nome.trim().length < 2) f.push(["nome", "seu nome"]);
  if (estado.modo === "entrega") {
    if (!estado.rua.trim()) f.push(["rua", "a rua"]);
    if (!estado.numero.trim()) f.push(["numero", "o número"]);
    if (!estado.bairro.trim()) f.push(["bairro", "o bairro"]);
  }
  return f;
}

/* ---------------------------- renderização -------------------------- */
function passoHtml(id, qtd, pequeno) {
  const p = produto(id);
  return `<div class="passo${pequeno ? " pequeno" : ""}"><button type="button" data-acao="menos" data-id="${id}" aria-label="Tirar um ${esc(p.nome)}">−</button><output aria-label="Quantidade">${qtd}</output><button type="button" data-acao="mais" data-id="${id}" aria-label="Mais um ${esc(p.nome)}">+</button></div>`;
}
function controleHtml(p) {
  if (p.disponivel === false) return `<span class="nota">Esgotado hoje</span>`;
  const q = estado.itens[p.id] || 0;
  return q ? passoHtml(p.id, q) : `<button class="mais" type="button" data-acao="mais" data-id="${p.id}" aria-label="Adicionar ${esc(p.nome)}">+ Adicionar</button>`;
}
const seloHtml = (id) => { const q = estado.itens[id] || 0; return q ? `<span class="qtd" aria-hidden="true">${q}</span>` : ""; };

function desenharFixos() {
  $("#marca-cookie").innerHTML = cookieSvg();
  const s = situacao(), e = LOJA.entrega;
  $("#info-loja").innerHTML = [
    s ? `<li class="estado"><span class="ponto${s.aberto ? " aberto" : ""}"></span>${esc(s.texto)}</li>` : "",
    `<li>Pedidos pelo WhatsApp</li>`,
    e.tempo ? `<li>Entrega em ${esc(e.tempo)}</li>` : "",
    e.taxa !== null && !BAIRROS.length ? `<li>Taxa de entrega ${reais(e.taxa)}</li>` : "",
    e.retirada ? `<li>Entrega ou retirada</li>` : "",
    `<li>Pix ou cartão</li>`,
    LOJA.pedidoMinimo ? `<li>Pedido mínimo ${reais(LOJA.pedidoMinimo)}</li>` : ""
  ].join("");
  const cats = LOJA.categorias.filter((c) => LOJA.produtos.some((p) => p.cat === c.id));
  $("#cardapio").innerHTML = `<div class="atalhos" id="atalhos"></div>` + cats.map((c) => `<section class="cat" id="${c.id}"><h2>${esc(c.nome)}</h2><div class="grade">` +
    LOJA.produtos.filter((p) => p.cat === c.id).map((p) => `<article class="item">
      <button class="foto" type="button" ${p.disponivel === false ? "disabled" : `data-acao="mais" data-id="${p.id}"`} aria-label="Adicionar ${esc(p.nome)}"><img src="${p.foto}" alt="${esc(p.nome)} partido ao meio" width="480" height="480" decoding="async"><span data-selo="${p.id}"></span></button>
      <div class="item-texto"><h3 class="item-nome">${esc(p.nome)}</h3><p class="item-desc">${esc(p.desc)}</p></div>
      <div class="item-base"><span class="preco">${reais(p.preco)}</span><div class="item-acao" data-controle="${p.id}"></div></div></article>`).join("") + `</div></section>`).join("");

  $("#rodape").innerHTML = `<div><h2>Como funciona</h2><ol><li>Escolha os sabores e a quantidade.</li><li>Preencha nome e endereço.</li><li>Envie o pedido pronto no WhatsApp.</li><li>A loja responde com o Pix ou o link do cartão.</li></ol></div>` +
    (s ? `<div><h2>Horários</h2><dl class="horas">${DIAS.map((d, i) => { const h = LOJA.horarios[d]; return `<dt class="${i === s.dia ? "hoje" : ""}">${DIAS_NOME[i]}</dt><dd class="${i === s.dia ? "hoje" : ""}">${h ? horaCurta(h[0]) + " às " + horaCurta(h[1]) : "Fechado"}</dd>`; }).join("")}</dl></div>` : "") +
    `<div><h2>Contato</h2><p>${TEM_ZAP ? `WhatsApp <span class="numero">${esc(foneBonito())}</span>` : "WhatsApp da loja ainda não cadastrado."}</p>${e.retirada && e.enderecoRetirada ? `<p>Retirada: ${esc(e.enderecoRetirada)}</p>` : ""}</div>`;

  if (!TEM_ZAP) {
    $("#aviso-demo").innerHTML = `<strong>Em teste.</strong> Falta cadastrar o WhatsApp da loja. Por enquanto o botão abre o WhatsApp para você escolher para quem enviar.`;
    $("#aviso-demo").hidden = false;
  }
}

function desenharControles() {
  for (const el of document.querySelectorAll("[data-controle]")) el.innerHTML = controleHtml(produto(el.dataset.controle));
  for (const el of document.querySelectorAll("[data-selo]")) el.innerHTML = seloHtml(el.dataset.selo);
  const c = contas(), barra = $("#barra");
  barra.hidden = c.unidades === 0 || estado.aberta;
  $("#barra-rotulo").textContent = `Ver pedido (${plural(c.unidades, "cookie", "cookies")})`;
  $("#barra-total").textContent = reais(c.subtotal);
  const nUlt = estado.ultimo ? Object.values(estado.ultimo).reduce((a, b) => a + b, 0) : 0;
  $("#atalhos").innerHTML =
    (estado.ultimo && c.unidades === 0 ? `<button class="atalho" type="button" data-acao="repetir">Repetir meu último pedido (${plural(nUlt, "cookie", "cookies")})</button>` : "");
}

function totaisHtml(c) {
  const entrega = estado.modo === "entrega";
  return `<dl class="totais"><dt>${plural(c.unidades, "cookie", "cookies")}</dt><dd>${reais(c.subtotal)}</dd>` +
    (entrega ? `<dt>Entrega</dt><dd>${c.taxa === null ? (BAIRROS.length ? "Escolha o bairro" : "A loja confirma") : reais(c.taxa)}</dd>` : `<dt>Retirada na loja</dt><dd>Grátis</dd>`) +
    `</dl>`;
}
const totalTexto = (c) => c.taxa === null ? reais(c.subtotal) + " + entrega" : reais(c.total);
function atualizarResumo() {
  const c = contas(), t = $("#totais"), b = $("#enviar");
  if (t) t.innerHTML = totaisHtml(c);
  if (b) b.href = linkZap();
  const tt = $("#total-valor"), er = $("#erro");
  if (tt) tt.textContent = totalTexto(c);
  if (er && estado.erro) {
    const f = faltando();
    estado.faltando = f.map((x) => x[0]);
    estado.erro = f.length ? "Falta preencher " + f.map((x) => x[1]).join(", ").replace(/, ([^,]*)$/, " e $1") + "." : "";
    er.textContent = estado.erro; er.hidden = !estado.erro;
  }
  const pv = $("#pedido-texto");
  if (pv) pv.textContent = textoPedido().replace(/\*/g, "");
}

function desenharSacola() {
  const c = contas(), s = situacao(), inv = (id) => estado.faltando.includes(id) ? ' aria-invalid="true"' : "";
  const topo = `<div class="sacola-topo"><h2>Seu pedido</h2><button class="link so-celular" type="button" data-acao="fechar-sacola">Voltar aos sabores</button></div>`;
  let corpo;
  if (!c.linhas.length) {
    corpo = `<div class="vazio">${cookieSvg()}<p>Nenhum cookie escolhido ainda. Toque na foto ou em Adicionar para começar.</p></div>`;
  } else {
    const falta = LOJA.pedidoMinimo ? LOJA.pedidoMinimo - c.subtotal : 0;
    const bairro = BAIRROS.length
      ? `<select id="bairro"${inv("bairro")}><option value="">Escolha o bairro</option>${BAIRROS.map((b) => `<option value="${esc(b.nome)}"${b.nome === estado.bairro ? " selected" : ""}>${esc(b.nome)} (${reais(b.taxa)})</option>`).join("")}</select>`
      : `<input id="bairro" autocomplete="address-level3" enterkeyhint="next" maxlength="50" value="${esc(estado.bairro)}"${inv("bairro")}>`;
    corpo = `<div class="bloco">
      <div class="linhas">${c.linhas.map((l) => `<div class="linha"><div><div class="linha-nome">${esc(l.nome)}</div><div class="linha-preco">${reais(l.unit)} cada, ${reais(l.total)}</div></div>${passoHtml(l.id, l.qtd, true)}</div>`).join("")}</div>
      <div class="campo"><label for="obs">Observação (opcional)</label><textarea id="obs" rows="2" maxlength="200" placeholder="Ex.: é presente, tocar o interfone 12">${esc(estado.obs)}</textarea></div>

      <div class="campo"><label for="nome">Seu nome</label><input id="nome" autocomplete="name" autocapitalize="words" enterkeyhint="next" maxlength="60" value="${esc(estado.nome)}"${inv("nome")}></div>
      ${LOJA.entrega.retirada ? `<div class="troca" role="radiogroup" aria-label="Entrega ou retirada">
        <label><input type="radio" name="modo" id="modo-entrega" value="entrega"${estado.modo === "entrega" ? " checked" : ""}>Entrega</label>
        <label><input type="radio" name="modo" id="modo-retirada" value="retirada"${estado.modo === "retirada" ? " checked" : ""}>Retirada</label></div>` : ""}
      ${estado.modo === "entrega" ? `<div class="dupla"><div class="campo"><label for="rua">Rua</label><input id="rua" autocomplete="address-line1" enterkeyhint="next" maxlength="80" value="${esc(estado.rua)}"${inv("rua")}></div>
        <div class="campo"><label for="numero">Número</label><input id="numero" inputmode="numeric" enterkeyhint="next" maxlength="10" value="${esc(estado.numero)}"${inv("numero")}></div></div>
        <div class="campo"><label for="bairro">Bairro</label>${bairro}</div>
        <div class="campo"><label for="compl">Complemento ou referência (opcional)</label><input id="compl" enterkeyhint="done" maxlength="80" value="${esc(estado.compl)}"></div>`
        : `<p class="nota">${LOJA.entrega.enderecoRetirada ? "Retire em " + esc(LOJA.entrega.enderecoRetirada) + "." : "A loja combina o endereço e o horário da retirada pelo WhatsApp."}</p>`}

      <h3 class="sub">Pagamento</h3>
      <div class="troca" role="radiogroup" aria-label="Forma de pagamento">
        <label><input type="radio" name="pag" id="pag-pix" value="pix"${estado.pagamento === "pix" ? " checked" : ""}>Pix</label>
        <label><input type="radio" name="pag" id="pag-cartao" value="cartao"${estado.pagamento === "cartao" ? " checked" : ""}>Cartão</label></div>
      <p class="nota">${estado.pagamento === "pix" ? "A loja envia a chave Pix na conversa." : "A loja envia o link de pagamento do cartão na conversa."}</p>

      <div id="totais">${totaisHtml(c)}</div>
      ${s && !s.aberto ? `<p class="aviso">Estamos fechados agora. Pode enviar: a loja responde assim que abrir.</p>` : ""}
      ${falta > 0 ? `<p class="aviso">O pedido mínimo é ${reais(LOJA.pedidoMinimo)}. Faltam ${reais(falta)}.</p>` : ""}
      <div class="fecho">
        <p class="erro" id="erro" role="alert"${estado.erro ? "" : " hidden"}>${esc(estado.erro)}</p>
        <div class="total-linha"><span>Total</span><span id="total-valor">${totalTexto(c)}</span></div>
        <a class="botao zap" id="enviar" href="${esc(linkZap())}" target="_blank" rel="noopener" data-acao="enviar">${ICONE_ZAP}Enviar pedido no WhatsApp</a>
      </div>
      <div class="acoes">
        ${estado.enviado ? `<p class="nota">O WhatsApp abre com o pedido escrito. É só tocar em enviar e aguardar a resposta da loja.${TEM_ZAP ? ` Não abriu? Copie o pedido e mande para <span class="numero">${esc(foneBonito())}</span>.` : ""}</p>
          <pre class="previa" id="pedido-texto">${esc(textoPedido().replace(/\*/g, ""))}</pre>
          <button class="botao vazado" type="button" data-acao="copiar" data-alvo="pedido-texto" data-feito="Pedido copiado">Copiar pedido</button>
          <button class="link" type="button" data-acao="novo">Começar outro pedido</button><span aria-hidden="true" style="height:0.75rem"></span>` : ""}
      </div></div>`;
  }
  $("#sacola").innerHTML = topo + corpo;
}

function desenhar() { desenharSacola(); desenharControles(); }

/* ------------------------------ ações ------------------------------- */
function mudarItem(id, delta) {
  const p = produto(id);
  if (!p || p.disponivel === false) return;
  const q = Math.max(0, Math.min(99, (estado.itens[id] || 0) + delta));
  if (q) estado.itens[id] = q; else delete estado.itens[id];
  estado.erro = ""; estado.faltando = [];
  salvar(); desenhar();
}
function abrirSacola(sim) {
  estado.aberta = sim;
  $("#sacola").classList.toggle("aberta", sim);
  document.body.classList.toggle("travado", sim);
  desenharControles();
  if (sim) $("#sacola").scrollTop = 0;
}
async function copiar(botao) {
  const alvo = document.getElementById(botao.dataset.alvo);
  const texto = alvo.value !== undefined ? alvo.value : alvo.textContent;
  const original = botao.dataset.original || botao.textContent;
  botao.dataset.original = original;
  try { await navigator.clipboard.writeText(texto); botao.textContent = botao.dataset.feito; }
  catch (e) {
    const r = document.createRange(); r.selectNodeContents(alvo); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    botao.textContent = "Texto selecionado: copie pelo menu do aparelho";
  }
  setTimeout(() => { botao.textContent = original; }, 2500);
}

document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-acao]");
  if (!el) return;
  const a = el.dataset.acao;
  if (a === "mais") mudarItem(el.dataset.id, 1);
  else if (a === "menos") mudarItem(el.dataset.id, -1);
  else if (a === "abrir-sacola") abrirSacola(true);
  else if (a === "fechar-sacola") abrirSacola(false);
  else if (a === "copiar") copiar(el);
  else if (a === "repetir") { estado.itens = { ...estado.ultimo }; salvar(); desenhar(); }
  else if (a === "novo") { estado.itens = {}; estado.obs = ""; estado.enviado = false; estado.erro = ""; estado.faltando = []; estado.pedidoId = novoId(); salvar(); desenhar(); abrirSacola(false); }
  else if (a === "enviar") {
    const f = faltando(), minimo = LOJA.pedidoMinimo && contas().subtotal < LOJA.pedidoMinimo;
    if (f.length || minimo) {
      ev.preventDefault();
      estado.faltando = f.map((x) => x[0]);
      estado.erro = f.length ? "Falta preencher " + f.map((x) => x[1]).join(", ").replace(/, ([^,]*)$/, " e $1") + "." : "O pedido ainda não chegou ao valor mínimo.";
      desenharSacola();
      if (f.length) document.getElementById(f[0][0])?.focus();
      return;
    }
    el.href = linkZap();                       // garante a mensagem mais recente; o próprio link abre o WhatsApp
    estado.ultimo = { ...estado.itens }; estado.erro = ""; estado.faltando = []; salvar();
    if (!estado.enviado) { estado.enviado = true; setTimeout(desenharSacola, 400); }
  }
});
document.addEventListener("input", (ev) => {
  const t = ev.target;
  if (["obs", "nome", "rua", "numero", "bairro", "compl"].includes(t.id)) {
    estado[t.id] = t.value;
    if (t.getAttribute("aria-invalid") && t.value.trim()) t.removeAttribute("aria-invalid");
    salvar(); atualizarResumo();
  }
});
document.addEventListener("change", (ev) => {
  const t = ev.target;
  if (t.name === "modo") { estado.modo = t.value; estado.erro = ""; estado.faltando = []; salvar(); desenhar(); document.getElementById("modo-" + t.value)?.focus(); }
  else if (t.name === "pag") { estado.pagamento = t.value; salvar(); desenharSacola(); document.getElementById("pag-" + t.value)?.focus(); }
});
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && estado.aberta) abrirSacola(false); });

desenharFixos();
desenhar();
</script>

</body></html>
