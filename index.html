<style>
:root { color-scheme: light; padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }

</style>
<style>
/* Layout: tudo no eixo central. A marca abre a página como no logo; cada cookie fica numa moldura em arco, a vitrine;
   o pedido abre por cima (tela cheia no celular, janela centralizada no computador). */
:root {
  --bg: #FBEDE0;          /* creme do logo */
  --glow: #FFF8F0;        /* luz suave atrás da marca */
  --surface: #FFF9F3;     /* papel: janela do pedido */
  --ink: #3B2414;         /* texto */
  --ink-soft: #7B604D;    /* texto de apoio */
  --brand: #5F381B;       /* chocolate do logo */
  --on-brand: #FBEDE0;
  --gold: #C0A280;        /* filete do logo */
  --gold-ink: #84633A;    /* dourado legível em texto */
  --rule: #E9D5C1;
  --ok: #2F6B3F;
  --warn: #9A3B1E;
  --warn-bg: #F7DCCB;
  --zap: #1F7A4D;         /* botão do WhatsApp */
  --on-zap: #FFFFFF;
  --frame: rgba(255, 255, 255, 0.6);   /* filete interno das fotos */
  --shadow: rgba(95, 56, 27, 0.38);
  --veil: rgba(59, 36, 20, 0.5);
  --f-display: "Cormorant Garamond", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --f-text: "Jost", "Avenir Next", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1B120C; --glow: #2B1D14; --surface: #271A12; --ink: #F3E3D2; --ink-soft: #C2A993; --brand: #E9CFAE; --on-brand: #2A1A0F;
    --gold: #B39470; --gold-ink: #D2B48C; --rule: #3D2B1F; --ok: #8FCB9C; --warn: #F0A988; --warn-bg: #4A2416; --zap: #2E9B63; --on-zap: #FFFFFF;
    --frame: rgba(255, 255, 255, 0.45); --shadow: rgba(0, 0, 0, 0.7); --veil: rgba(0, 0, 0, 0.62);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1B120C; --glow: #2B1D14; --surface: #271A12; --ink: #F3E3D2; --ink-soft: #C2A993; --brand: #E9CFAE; --on-brand: #2A1A0F;
  --gold: #B39470; --gold-ink: #D2B48C; --rule: #3D2B1F; --ok: #8FCB9C; --warn: #F0A988; --warn-bg: #4A2416; --zap: #2E9B63; --on-zap: #FFFFFF;
  --frame: rgba(255, 255, 255, 0.45); --shadow: rgba(0, 0, 0, 0.7); --veil: rgba(0, 0, 0, 0.62);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-text); font-size: 1rem; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body.travado { overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button, a, label, input, select, textarea { touch-action: manipulation; }
button, a, label { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
h1, h2, h3, p, ul, ol, dl { margin: 0; }
ul, ol { padding: 0; list-style: none; }

.demo { background: var(--warn-bg); color: var(--ink); font-size: 0.875rem; padding: 0.625rem 1rem; text-align: center; }
.demo strong { font-weight: 600; }

.pagina { max-width: 54rem; margin-inline: auto; padding-inline: 1rem; padding-block: 0 7rem; background: radial-gradient(ellipse 85% 24rem at 50% 0, var(--glow), transparent 72%) no-repeat; }

/* ---------- marca ---------- */
.topo { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 0.9rem; padding-block: 2.25rem 0.5rem; }
.marca { display: inline-flex; flex-direction: column; align-items: stretch; color: var(--brand); }
.marca-nome { font-family: var(--f-display); font-weight: 500; font-size: clamp(3.5rem, 17vw, 5.25rem); line-height: 0.92; letter-spacing: 0.01em; display: flex; align-items: baseline; justify-content: center; }
.marca-nome svg { width: 0.62em; height: 0.62em; margin-inline: 0.03em; align-self: flex-end; margin-bottom: 0.07em; flex: none; }
.marca-sub { display: flex; align-items: center; gap: 0.75rem; margin-top: 0.55rem; font-size: 0.8125rem; font-weight: 500; letter-spacing: 0.6em; text-indent: 0.6em; text-transform: uppercase; }
.marca-sub::before, .marca-sub::after { content: ""; flex: 1; height: 1px; background: var(--gold); }
.chamada { font-family: var(--f-display); font-style: italic; font-weight: 500; font-size: 1.25rem; line-height: 1.25; color: var(--ink-soft); max-width: 19rem; text-wrap: balance; }
.info { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.1rem 1.25rem; font-size: 0.875rem; color: var(--ink-soft); }
.info:empty { display: none; }
.info li { display: inline-flex; align-items: center; gap: 0.4rem; }
.info .estado { color: var(--ink); font-weight: 500; }
.ponto { width: 0.55rem; height: 0.55rem; border-radius: 50%; background: var(--warn); flex: none; }
.ponto.aberto { background: var(--ok); }
.atalhos { display: flex; justify-content: center; padding-top: 0.25rem; }
.atalhos:empty { display: none; }
.atalho { border: 1px solid var(--gold); background: transparent; color: var(--brand); border-radius: 999px; padding: 0.6rem 1.1rem; font-size: 0.9375rem; font-weight: 500; }

/* ---------- vitrine ---------- */
.cat h2 { font-family: var(--f-display); font-style: italic; font-weight: 500; font-size: 1.625rem; color: var(--brand); text-align: center; padding-top: 2rem; }
.grade { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2.5rem 1.25rem; padding-top: 1.75rem; }
.item { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 0.3rem; min-width: 0; }
.foto { position: relative; display: block; width: 100%; max-width: 100%; aspect-ratio: 25 / 28; padding: 0; border: 0; margin-bottom: 0.65rem; background: var(--rule); border-radius: 50% 50% 1.25rem 1.25rem / 44.64% 44.64% 1.25rem 1.25rem; box-shadow: 0 1.2rem 1.75rem -1.3rem var(--shadow); }
.foto img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }
.foto::after { content: ""; position: absolute; inset: 0.4rem; border: 1px solid var(--frame); border-radius: 50% 50% 0.85rem 0.85rem / 44.64% 44.64% 0.85rem 0.85rem; pointer-events: none; }
.item.tem .foto { box-shadow: 0 0 0 3px var(--bg), 0 0 0 4.5px var(--brand), 0 1.2rem 1.75rem -1.3rem var(--shadow); }
.foto .qtd { position: absolute; z-index: 1; top: -0.8rem; left: 50%; translate: -50% 0; min-width: 2.125rem; height: 2.125rem; padding-inline: 0.5rem; border-radius: 999px; background: var(--brand); color: var(--on-brand); font-size: 1.0625rem; font-weight: 600; display: grid; place-items: center; box-shadow: 0 0 0 3px var(--bg); font-variant-numeric: tabular-nums; }
.item-nome { font-family: var(--f-display); font-weight: 600; font-size: 1.875rem; line-height: 1.02; color: var(--brand); }
.item-desc { flex: 1; font-size: 0.8125rem; line-height: 1.45; color: var(--ink-soft); max-width: 16rem; }
.preco { font-weight: 500; font-size: 1.0625rem; font-variant-numeric: tabular-nums; margin-top: 0.2rem; }
.item-acao { width: 100%; max-width: 10.5rem; margin-top: 0.45rem; }

.mais { width: 100%; min-height: 2.75rem; border-radius: 999px; border: 1px solid var(--brand); background: transparent; color: var(--brand); font-size: 0.9375rem; font-weight: 500; }
.passo { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 2.75rem; border-radius: 999px; border: 1px solid var(--brand); background: var(--brand); color: var(--on-brand); }
.passo button { width: 2.75rem; height: 2.75rem; flex: none; border: 0; border-radius: 50%; background: transparent; color: inherit; font-size: 1.375rem; line-height: 1; display: grid; place-items: center; }
.passo output { flex: 1; min-width: 1.5rem; text-align: center; font-weight: 600; font-size: 1.0625rem; font-variant-numeric: tabular-nums; }
.passo.pequeno { display: inline-flex; width: auto; min-height: 2.5rem; background: transparent; color: var(--brand); border-color: var(--gold); }
.passo.pequeno button { width: 2.5rem; height: 2.5rem; font-size: 1.25rem; }
.passo, .mais, .foto, .botao, .atalho { -webkit-user-select: none; user-select: none; }

/* ---------- pedido (janela) ---------- */
.fundo { position: fixed; inset: 0; z-index: 19; background: var(--veil); }
.sacola { position: fixed; inset: 0; z-index: 20; overflow-y: auto; overscroll-behavior: contain; background: var(--surface); padding: calc(1rem + env(safe-area-inset-top, 0px)) 1rem 0; }
.sacola-topo { position: relative; display: flex; align-items: center; justify-content: center; min-height: 2.75rem; margin-bottom: 0.75rem; }
.sacola-topo h2 { font-family: var(--f-display); font-weight: 600; font-size: 1.875rem; line-height: 1; color: var(--brand); }
.fechar { position: absolute; right: 0; top: 0; width: 2.75rem; height: 2.75rem; border-radius: 50%; border: 1px solid var(--rule); background: transparent; color: var(--brand); display: grid; place-items: center; }
.fechar svg { width: 1rem; height: 1rem; }
.link { background: none; border: 0; padding: 0.5rem 0; color: var(--brand); text-decoration: underline; text-underline-offset: 0.2em; font-size: 0.9375rem; align-self: center; }
.bloco { display: flex; flex-direction: column; gap: 0.9rem; }
.vazio { color: var(--ink-soft); padding-block: 2rem 2.5rem; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 1rem; }
.vazio svg { width: 3.5rem; height: 3.5rem; color: var(--gold); }
.vazio p { max-width: 17rem; }

.linhas { display: flex; flex-direction: column; }
.linha { display: grid; grid-template-columns: 3.25rem minmax(0, 1fr) auto; gap: 0.75rem; align-items: center; padding-block: 0.65rem; border-bottom: 1px solid var(--rule); }
.linha img { display: block; width: 3.25rem; height: 3.25rem; border-radius: 50%; object-fit: cover; }
.linha-nome { font-family: var(--f-display); font-weight: 600; font-size: 1.25rem; line-height: 1.1; color: var(--brand); }
.linha-preco { color: var(--ink-soft); font-size: 0.875rem; font-variant-numeric: tabular-nums; }
.totais { display: grid; grid-template-columns: 1fr auto; gap: 0.3rem 1rem; font-variant-numeric: tabular-nums; padding-top: 0.75rem; border-top: 1px solid var(--rule); }
.totais dt, .totais dd { margin: 0; }
.totais dt { color: var(--ink-soft); }
.totais dd { text-align: right; }
.fecho { position: sticky; bottom: 0; z-index: 2; display: flex; flex-direction: column; gap: 0.55rem; background: var(--surface); border-top: 1px solid var(--rule); margin-inline: -1rem; padding: 0.8rem 1rem calc(0.85rem + env(safe-area-inset-bottom, 0px)); }
.total-linha { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; font-weight: 600; font-size: 1.125rem; font-variant-numeric: tabular-nums; }

.campo { display: flex; flex-direction: column; gap: 0.3rem; }
.campo label, .rotulo { font-size: 0.8125rem; font-weight: 500; letter-spacing: 0.04em; color: var(--ink-soft); }
.campo input, .campo textarea, .campo select { width: 100%; background: var(--bg); border: 1px solid var(--rule); border-radius: 0.75rem; padding: 0.75rem 0.9rem; font-size: 1rem; }
.campo input:focus, .campo textarea:focus, .campo select:focus { border-color: var(--brand); outline: none; box-shadow: 0 0 0 1px var(--brand); }
.campo [aria-invalid="true"] { border-color: var(--warn); box-shadow: 0 0 0 1px var(--warn); }
.dupla { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 0.75rem; }
.erro { color: var(--warn); font-size: 0.9375rem; font-weight: 500; text-align: center; }
.nota { color: var(--ink-soft); font-size: 0.9375rem; }
.aviso { background: var(--warn-bg); border-radius: 0.75rem; padding: 0.7rem 0.9rem; font-size: 0.9375rem; }
.aviso.central { text-align: center; font-weight: 500; padding-inline: 1.1rem; text-wrap: balance; }
.botao[aria-disabled="true"] { opacity: 0.45; pointer-events: none; }
.mais:disabled { border-color: var(--rule); color: var(--ink-soft); cursor: default; }
.fechada .foto { cursor: default; }
.troca { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--brand); border-radius: 999px; padding: 0.2rem; }
.troca label { text-align: center; padding: 0.55rem 0.5rem; border-radius: 999px; cursor: pointer; font-weight: 500; color: var(--brand); }
.troca input { position: absolute; opacity: 0; pointer-events: none; }
.troca label:has(input:checked) { background: var(--brand); color: var(--on-brand); }
.troca label:has(input:focus-visible) { outline: 2px solid var(--brand); outline-offset: 2px; }

.botao { display: inline-flex; align-items: center; justify-content: center; gap: 0.6rem; width: 100%; min-height: 3.25rem; padding: 0.75rem 1.25rem; border-radius: 999px; border: 1px solid var(--brand); background: var(--brand); color: var(--on-brand); font-weight: 600; font-size: 1rem; text-decoration: none; text-align: center; }
.botao.vazado { background: transparent; color: var(--brand); }
.botao.zap { background: var(--zap); border-color: var(--zap); color: var(--on-zap); min-height: 3.5rem; font-size: 1.0625rem; }
.botao.zap svg { width: 1.35rem; height: 1.35rem; flex: none; }
.botao.medio { width: auto; min-height: 2.75rem; padding-inline: 1.5rem; }
.acoes { display: flex; flex-direction: column; gap: 0.5rem; }
.acoes:empty { display: none; }
.previa { white-space: pre-wrap; background: var(--bg); border: 1px solid var(--rule); border-radius: 0.75rem; padding: 0.75rem 0.9rem; font-size: 0.875rem; line-height: 1.45; margin: 0; font-family: var(--f-text); overflow-wrap: anywhere; }
.numero { font-weight: 600; user-select: all; font-variant-numeric: tabular-nums; color: var(--ink); }

/* ---------- barra do pedido ---------- */
.barra { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; justify-content: center; padding: 1.25rem 1rem calc(0.85rem + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 62%, transparent); }
.barra .botao { max-width: 26rem; justify-content: space-between; gap: 0.75rem; padding: 0.4rem 1.35rem 0.4rem 0.4rem; min-height: 3.5rem; box-shadow: 0 0.9rem 1.75rem -1rem var(--shadow); }
.barra .n { min-width: 2.7rem; height: 2.7rem; padding-inline: 0.5rem; border-radius: 999px; background: var(--on-brand); color: var(--brand); display: grid; place-items: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.barra .rot { flex: 1; text-align: left; white-space: nowrap; }
.barra .conta { white-space: nowrap; font-variant-numeric: tabular-nums; }

/* ---------- rodapé ---------- */
.rodape { margin-top: 4rem; padding-top: 2.25rem; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 1.5rem; font-size: 0.9375rem; color: var(--ink-soft); background: linear-gradient(90deg, transparent, var(--gold), transparent) top / min(18rem, 70%) 1px no-repeat; }
.rodape h2 { font-family: var(--f-display); font-style: italic; font-weight: 500; font-size: 1.625rem; line-height: 1.1; color: var(--brand); }
.passos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.5rem 1rem; width: 100%; max-width: 30rem; counter-reset: passo; }
.passos li { counter-increment: passo; display: flex; flex-direction: column; align-items: center; gap: 0.3rem; text-wrap: balance; }
.passos li::before { content: counter(passo); font-family: var(--f-display); font-weight: 500; font-size: 2rem; line-height: 1; color: var(--gold-ink); font-variant-numeric: lining-nums; }
.horas { display: grid; grid-template-columns: auto auto; justify-content: center; gap: 0.15rem 1.25rem; font-variant-numeric: tabular-nums; text-align: left; }
.horas dt, .horas dd { margin: 0; }
.horas .hoje { color: var(--ink); font-weight: 500; }
.credito { font-size: 0.8125rem; }
.credito a { color: inherit; }
.rodape-marca { color: var(--gold); line-height: 0; }
.rodape-marca svg { width: 1.75rem; height: 1.75rem; }

@media (min-width: 40rem) {
  .topo { padding-block: 3.25rem 1rem; gap: 1.1rem; }
  .chamada { font-size: 1.4375rem; max-width: 30rem; }
  .grade { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3.5rem 2.25rem; padding-top: 2.5rem; }
  .item-nome { font-size: 2.125rem; }
  .item-desc { font-size: 0.875rem; }
  .passos { grid-template-columns: repeat(4, minmax(0, 1fr)); max-width: 48rem; }
  .sacola { inset: 0; margin: auto; width: min(31rem, calc(100% - 2rem)); height: fit-content; max-height: min(92vh, 56rem); border-radius: 1.25rem; padding: 1.5rem 1.5rem 0; box-shadow: 0 2rem 4rem -1.5rem var(--shadow); }
  .fecho { margin-inline: -1.5rem; padding: 0.9rem 1.5rem 1.25rem; border-radius: 0 0 1.25rem 1.25rem; }
}
@media (max-width: 22rem) {
  .item-nome { font-size: 1.625rem; }
  .barra .botao { font-size: 0.9375rem; padding-right: 1rem; }
}
@media (prefers-reduced-motion: no-preference) {
  @keyframes surgir { from { opacity: 0; transform: translateY(0.9rem); } }
  @keyframes saltar { from { transform: scale(0.4); } }
  @keyframes subir { from { opacity: 0; translate: 0 1.75rem; } }
  @keyframes clarear { from { opacity: 0; } }
  .marca, .chamada, .item { animation: surgir 0.75s cubic-bezier(0.2, 0.7, 0.2, 1) backwards; }
  .chamada { animation-delay: 0.12s; }
  .item { animation-delay: calc(0.22s + var(--i, 0) * 0.07s); }
  .qtd { animation: saltar 0.28s cubic-bezier(0.3, 1.6, 0.5, 1); }
  .sacola { animation: subir 0.3s cubic-bezier(0.2, 0.7, 0.2, 1); }
  .fundo { animation: clarear 0.25s ease-out; }
  .barra .botao { animation: subir 0.3s cubic-bezier(0.2, 0.7, 0.2, 1); }
  .foto, .mais, .botao { transition: transform 0.14s ease; }
  .foto:active, .mais:active, .botao:active { transform: scale(0.97); }
}
</style>
</head>
<body>
<div class="demo" id="aviso-demo" hidden></div>

<div class="pagina" id="pagina">
  <header class="topo">
    <div class="marca">
      <h1 class="marca-nome" aria-label="Milotte Cookie"><span aria-hidden="true">Mil</span><span id="marca-cookie" aria-hidden="true" style="display:contents"></span><span aria-hidden="true">tte</span></h1>
      <p class="marca-sub" aria-hidden="true">Cookie</p>
    </div>
    <p class="chamada">Escolha seus sabores e envie o pedido pelo WhatsApp</p>
    <p class="aviso central" id="aviso-fechado" role="status" hidden></p>
    <ul class="info" id="info-loja"></ul>
    <div class="atalhos" id="atalhos"></div>
  </header>

  <main id="cardapio"></main>

  <footer class="rodape" id="rodape"></footer>

/* ---------------------------- horários ------------------------------ */
const DIAS = ["dom", "seg", "ter", "qua", "qui", "sex", "sab"];
const DIAS_NOME = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];
const minutos = (hhmm) => { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; };
const horaCurta = (hhmm) => { const [h, m] = hhmm.split(":"); return Number(h) + "h" + (m === "00" ? "" : m); };
function agora() {
  try {
    const partes = new Intl.DateTimeFormat("en-US", { timeZone: LOJA.fuso, weekday: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(new Date());
    const m = Object.fromEntries(partes.map((p) => [p.type, p.value]));
    return { dia: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].indexOf(m.weekday), min: Number(m.hour) * 60 + Number(m.minute) };
  } catch (e) { const d = new Date(); return { dia: d.getDay(), min: d.getHours() * 60 + d.getMinutes() }; }
}
function situacao() {
  if (!LOJA.horarios && !LOJA.lojaFechada) return null;                 // sem horário cadastrado: sempre aceita pedido
  const { dia, min } = agora();
  if (LOJA.lojaFechada) return { aberto: false, texto: "Estamos fechados no momento.", dia };
  const h = LOJA.horarios[DIAS[dia]];
  if (h && min >= minutos(h[0]) && min < minutos(h[1])) return { aberto: true, texto: `Aberto agora, até ${horaCurta(h[1])}`, dia };
  let quando = "";
  if (h && min < minutos(h[0])) quando = `hoje às ${horaCurta(h[0])}`;
  else for (let i = 1; i <= 7 && !quando; i++) {
    const d = (dia + i) % 7, p = LOJA.horarios[DIAS[d]];
    if (p) quando = `${i === 1 ? "amanhã" : DIAS_NOME[d].toLowerCase()} às ${horaCurta(p[0])}`;
  }
  return { aberto: false, texto: quando ? `Estamos fechados agora. Abrimos ${quando}.` : "Estamos fechados no momento.", dia };
}
const aberta = () => { const s = situacao(); return !s || s.aberto; };

// Cookie mordido no traço do logo.
function cookieSvg() {
  const R = 40, c = 50, pt = (g) => { const a = g * Math.PI / 180; return [(c + R * Math.cos(a)).toFixed(2), (c + R * Math.sin(a)).toFixed(2)]; };
  const [a, b, d, e] = [-78, -54, -30, -6].map(pt), r = 9.2;
  const forma = `M${a} A${r} ${r} 0 0 0 ${b} A${r} ${r} 0 0 0 ${d} A${r} ${r} 0 0 0 ${e} A${R} ${R} 0 1 1 ${a}Z`;
  return `<svg viewBox="0 0 100 100" aria-hidden="true" focusable="false"><path d="${forma}" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linejoin="round"/>` +
    [[36, 34, 4.6], [58, 49, 3.6], [33, 58, 4.4], [50, 70, 4.4], [69, 64, 3.8]].map(([x, y, rr]) => `<circle cx="${x}" cy="${y}" r="${rr}" fill="currentColor"/>`).join("") + `</svg>`;
}

/* ------------------------------ estado ------------------------------ */
const CHAVE = "milotte-cardapio-v2";
const novoId = () => "ML" + Date.now().toString(36).toUpperCase().slice(-5);
const estado = { itens: {}, obs: "", nome: "", modo: "entrega", rua: "", numero: "", bairro: "", compl: "", pagamento: "pix", ultimo: null, pedidoId: novoId(), erro: "", faltando: [], enviado: false, aberta: false };
function itensValidos(obj) {
  const out = {};
  if (obj && typeof obj === "object") for (const [id, q] of Object.entries(obj)) if (produto(id) && produto(id).disponivel !== false && q > 0) out[id] = Math.min(99, Math.floor(q));
  return out;
}
try {
  const salvo = JSON.parse(localStorage.getItem(CHAVE) || "null");
  if (salvo && typeof salvo === "object") {
    for (const k of ["obs", "nome", "rua", "numero", "bairro", "compl"]) if (typeof salvo[k] === "string") estado[k] = salvo[k];
    if (salvo.modo === "retirada" || salvo.modo === "entrega") estado.modo = salvo.modo;
    if (salvo.pagamento === "pix" || salvo.pagamento === "cartao") estado.pagamento = salvo.pagamento;
    estado.itens = itensValidos(salvo.itens);
    const u = itensValidos(salvo.ultimo);
    estado.ultimo = Object.keys(u).length ? u : null;
  }
} catch (e) { /* sem armazenamento: segue em memória */ }
function salvar() {
  try { localStorage.setItem(CHAVE, JSON.stringify({ itens: estado.itens, obs: estado.obs, nome: estado.nome, modo: estado.modo, rua: estado.rua, numero: estado.numero, bairro: estado.bairro, compl: estado.compl, pagamento: estado.pagamento, ultimo: estado.ultimo })); } catch (e) { /* ignora */ }
}
if (!LOJA.entrega.retirada) estado.modo = "entrega";
const BAIRROS = Array.isArray(LOJA.entrega.bairros) ? LOJA.entrega.bairros : [];
if (BAIRROS.length && !BAIRROS.some((b) => b.nome === estado.bairro)) estado.bairro = "";

/* ----------------------- frete por distância ------------------------ */
const ENT = LOJA.entrega;
const POR_KM = typeof ENT.porKm === "number" && ENT.porKm > 0 && !!ENT.origem && Number.isFinite(ENT.origem.lat) && Number.isFinite(ENT.origem.lon);
const frete = { status: "vazio", chave: "", km: 0, valor: 0, aprox: false };
const cacheFrete = new Map();
let ultimaConsulta = 0, tempoFrete = 0, pedidoFrete = 0;
const kmTexto = (km) => km.toFixed(1).replace(".", ",");
const chaveEndereco = () => [estado.rua, estado.numero, estado.bairro].map((t) => t.trim().toLowerCase().replace(/\s+/g, " ")).join("|");
const enderecoCompleto = () => estado.rua.trim().length > 2 && !!estado.numero.trim() && estado.bairro.trim().length > 1;
// "vazio" (falta endereço), "buscando", "ok" ou "falhou" para o endereço que está digitado agora
function situacaoFrete() {
  if (!enderecoCompleto()) return "vazio";
  if (frete.chave !== chaveEndereco() || frete.status === "vazio") return "buscando";
  return frete.status;
}
function kmEntre(a, b) {
  const rad = Math.PI / 180, dLat = (b.lat - a.lat) * rad, dLon = (b.lon - a.lon) * rad;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLon / 2) ** 2;
  return 6371 * 2 * Math.asin(Math.sqrt(h));
}
function valorFrete(km) {
  const passo = ENT.arredondar > 0 ? ENT.arredondar : 1;
  const bruto = km * ENT.porKm * (ENT.idaEVolta ? 2 : 1);
  return Math.max(ENT.minimo || 0, Math.ceil(bruto / passo - 1e-9) * passo);
}
// Consulta o mapa do OpenStreetMap, no máximo uma vez por segundo. Devolve {lat, lon}, null (não achou) ou undefined (serviço fora).
async function consultarMapa(params) {
  const espera = 1100 - (Date.now() - ultimaConsulta);
  if (espera > 0) await new Promise((r) => setTimeout(r, espera));
  ultimaConsulta = Date.now();
  const ctrl = new AbortController(), limite = setTimeout(() => ctrl.abort(), 8000);
  try {
    const url = "https://nominatim.openstreetmap.org/search?" + new URLSearchParams({ format: "jsonv2", limit: "1", countrycodes: "br", "accept-language": "pt-BR", ...params });
    const r = await fetch(url, { signal: ctrl.signal });
    if (!r.ok) return undefined;
    const j = await r.json();
    if (!Array.isArray(j) || !j.length) return null;
    const ponto = { lat: parseFloat(j[0].lat), lon: parseFloat(j[0].lon) };
    return Number.isFinite(ponto.lat) && Number.isFinite(ponto.lon) && kmEntre(ENT.origem, ponto) <= 80 ? ponto : null;
  } catch (e) { return undefined; } finally { clearTimeout(limite); }
}
async function calcularFrete() {
  if (!POR_KM || estado.modo !== "entrega") return;
  if (!enderecoCompleto()) { frete.status = "vazio"; frete.chave = ""; atualizarResumo(); return; }
  const chave = chaveEndereco();
  if (frete.chave === chave && frete.status !== "vazio") return;
  if (cacheFrete.has(chave)) { Object.assign(frete, cacheFrete.get(chave), { chave }); atualizarResumo(); return; }
  const rua = estado.rua.trim(), numero = estado.numero.trim(), bairro = estado.bairro.trim(), local = { city: ENT.cidade, state: ENT.uf };
  const meu = ++pedidoFrete;
  Object.assign(frete, { status: "buscando", chave });
  atualizarResumo();
  let aprox = false;
  let ponto = await consultarMapa({ ...local, street: `${numero} ${rua}` });
  if (ponto === null) ponto = await consultarMapa({ ...local, street: rua });
  if (ponto === null) { ponto = await consultarMapa({ q: `${bairro}, ${ENT.cidade}, ${ENT.uf}` }); aprox = !!ponto; }   // não achou a rua: usa o centro do bairro
  if (meu !== pedidoFrete) return;                        // o endereço mudou no meio da consulta
  let res = { status: "falhou", km: 0, valor: 0, aprox: false };
  if (ponto) {
    const km = kmEntre(ENT.origem, ponto) * (ENT.fatorRota || 1);
    if (!ENT.raioMaximoKm || km <= ENT.raioMaximoKm) res = { status: "ok", km, valor: valorFrete(km), aprox };
  }
  if (ponto !== undefined) cacheFrete.set(chave, res);     // serviço fora do ar não fica guardado: tenta de novo depois
  Object.assign(frete, res, { chave });
  atualizarResumo();
}
function agendarFrete() {
  if (!POR_KM) return;
  clearTimeout(tempoFrete);
  tempoFrete = setTimeout(calcularFrete, 1300);
}

function contas() {
  const linhas = Object.entries(estado.itens).map(([id, qtd]) => { const p = produto(id); return { id, nome: p.nome, foto: p.foto, qtd, unit: p.preco, total: p.preco * qtd }; });
  const subtotal = linhas.reduce((s, l) => s + l.total, 0);
  const unidades = linhas.reduce((s, l) => s + l.qtd, 0);
  let taxa = 0, sf = "";                          // retirada
  if (estado.modo === "entrega") {
    if (POR_KM) { sf = situacaoFrete(); taxa = sf === "ok" ? frete.valor : null; }
    else { const b = BAIRROS.find((x) => x.nome === estado.bairro); taxa = BAIRROS.length ? (b ? b.taxa : null) : LOJA.entrega.taxa; }      // null = a confirmar
  }
  return { linhas, subtotal, unidades, taxa, sf, total: subtotal + (taxa || 0) };
}

/* --------------------------- mensagem ------------------------------- */
function textoPedido() {
  const c = contas(), entrega = estado.modo === "entrega";
  const end = `${estado.rua.trim()}, ${estado.numero.trim()}, ${estado.bairro.trim()}${estado.compl.trim() ? " (" + estado.compl.trim() + ")" : ""}`;
  return [
    `*Novo pedido ${estado.pedidoId}* | ${LOJA.nome}`,
    "",
    ...c.linhas.map((l) => `${l.qtd}x ${l.nome} | ${reais(l.total)}`),
    ...(estado.obs.trim() ? ["Obs.: " + estado.obs.trim()] : []),
    "",
    `Subtotal: ${reais(c.subtotal)}`,
    ...(entrega ? [c.taxa === null ? "Entrega: taxa a confirmar" : `Entrega: ${reais(c.taxa)}${c.sf === "ok" ? ` (cerca de ${kmTexto(frete.km)} km${frete.aprox ? ", pelo bairro" : ""})` : ""}`] : []),
    c.taxa === null ? `*Total: ${reais(c.subtotal)} + entrega*` : `*Total: ${reais(c.total)}*`,
    "",
    `Nome: ${estado.nome.trim()}`,
    entrega ? `Entregar em: ${end}` : "Retirada na loja",
    estado.pagamento === "pix" ? "Pagamento: Pix. Pode me enviar a chave?" : "Pagamento: cartão. Pode me enviar o link?"
  ].join("\n");
}
const linkZap = () => `https://wa.me/${foneLoja()}?text=${encodeURIComponent(textoPedido())}`;
function faltando() {
  const f = [];
  if (estado.nome.trim().length < 2) f.push(["nome", "seu nome"]);
  if (estado.modo === "entrega") {
    if (!estado.rua.trim()) f.push(["rua", "a rua"]);
    if (!estado.numero.trim()) f.push(["numero", "o número"]);
    if (!estado.bairro.trim()) f.push(["bairro", "o bairro"]);
  }
  return f;
}

/* ---------------------------- renderização -------------------------- */
function passoHtml(id, qtd, pequeno) {
  const p = produto(id);
  return `<div class="passo${pequeno ? " pequeno" : ""}"><button type="button" data-acao="menos" data-id="${id}" aria-label="Tirar um ${esc(p.nome)}">−</button><output aria-label="Quantidade">${qtd}</output><button type="button" data-acao="mais" data-id="${id}" aria-label="Mais um ${esc(p.nome)}">+</button></div>`;
}
function controleHtml(p, q) {
  if (p.disponivel === false) return `<span class="nota">Esgotado hoje</span>`;
  if (q) return passoHtml(p.id, q);
  if (!aberta()) return `<button class="mais" type="button" disabled>Fechado agora</button>`;
  return `<button class="mais" type="button" data-acao="mais" data-id="${p.id}" aria-label="Adicionar ${esc(p.nome)}">Adicionar</button>`;
}

function desenharFixos() {
  $("#marca-cookie").innerHTML = cookieSvg();
  const s = situacao(), e = LOJA.entrega;
  desenharStatus();
  const cats = LOJA.categorias.filter((c) => LOJA.produtos.some((p) => p.cat === c.id));
  let i = 0;
  $("#cardapio").innerHTML = cats.map((c) => `<section class="cat" id="${c.id}">${cats.length > 1 ? `<h2>${esc(c.nome)}</h2>` : ""}<div class="grade">` +
    LOJA.produtos.filter((p) => p.cat === c.id).map((p) => `<article class="item" data-item="${p.id}" style="--i:${i++}">
      <button class="foto" type="button" ${p.disponivel === false ? "disabled" : `data-acao="mais" data-id="${p.id}"`} aria-label="Adicionar ${esc(p.nome)}"><img src="${p.foto}" alt="${esc(p.nome)} partido ao meio, com o recheio à mostra" width="480" height="538" decoding="async"><span data-selo="${p.id}"></span></button>
      <h3 class="item-nome" aria-label="${esc(p.nome)}">${esc(nomeCurto(p))}</h3>
      <p class="item-desc">${esc(p.desc)}</p>
      <p class="preco">${reais(p.preco)}</p>
      <div class="item-acao" data-controle="${p.id}"></div></article>`).join("") + `</div></section>`).join("");

  $("#rodape").innerHTML = `<h2>Como funciona</h2>
    <ol class="passos"><li>Escolha os sabores</li><li>Informe nome e endereço</li><li>Envie o pedido no WhatsApp</li><li>Receba o Pix ou o link do cartão</li></ol>` +
    (s ? `<dl class="horas">${DIAS.map((d, j) => { const h = LOJA.horarios[d]; return `<dt class="${j === s.dia ? "hoje" : ""}">${DIAS_NOME[j]}</dt><dd class="${j === s.dia ? "hoje" : ""}">${h ? horaCurta(h[0]) + " às " + horaCurta(h[1]) : "Fechado"}</dd>`; }).join("")}</dl>` : "") +
    `<p>${TEM_ZAP ? `WhatsApp <span class="numero">${esc(foneBonito())}</span>` : "WhatsApp da loja ainda não cadastrado."}${e.retirada && e.enderecoRetirada ? `<br>Retirada: ${esc(e.enderecoRetirada)}` : ""}</p>
    ${POR_KM ? `<p class="credito">Distância da entrega estimada com dados do <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></p>` : ""}
    <div class="rodape-marca">${cookieSvg()}</div>`;

  if (!TEM_ZAP) {
    $("#aviso-demo").innerHTML = `<strong>Em teste.</strong> Falta cadastrar o WhatsApp da loja. Por enquanto o botão abre o WhatsApp para você escolher para quem enviar.`;
    $("#aviso-demo").hidden = false;
  }
}

function desenharStatus() {
  const s = situacao(), e = LOJA.entrega;
  const html = [
    s && s.aberto ? `<li class="estado"><span class="ponto aberto"></span>${esc(s.texto)}</li>` : "",
    e.tempo ? `<li>Entrega em ${esc(e.tempo)}</li>` : "",
    e.taxa !== null && !BAIRROS.length ? `<li>Taxa de entrega ${reais(e.taxa)}</li>` : "",
    LOJA.pedidoMinimo ? `<li>Pedido mínimo ${reais(LOJA.pedidoMinimo)}</li>` : ""
  ].join("");
  if ($("#info-loja").innerHTML !== html) $("#info-loja").innerHTML = html;
  const av = $("#aviso-fechado");
  av.hidden = !s || s.aberto;
  if (s && !s.aberto && av.textContent !== s.texto) av.textContent = s.texto;
}

// Atualiza só o que mudou na vitrine, para o contador "saltar" apenas no cookie tocado.
function desenharControles() {
  const ab = aberta() ? "1" : "0";
  $("#pagina").classList.toggle("fechada", ab === "0");
  for (const el of document.querySelectorAll("[data-controle]")) {
    const id = el.dataset.controle, q = estado.itens[id] || 0;
    if (el.dataset.q === String(q) && el.dataset.ab === ab) continue;
    const antes = el.dataset.ab === ab ? el.dataset.q : undefined;
    el.dataset.q = String(q); el.dataset.ab = ab;
    if (antes === undefined || (antes === "0") !== (q === 0)) el.innerHTML = controleHtml(produto(id), q);
    else el.querySelector("output").textContent = q;
    const item = el.closest(".item"), selo = item.querySelector("[data-selo]");
    item.classList.toggle("tem", q > 0);
    selo.innerHTML = q ? `<span class="qtd" aria-hidden="true">${q}</span>` : "";
  }
  const c = contas();
  $("#barra").hidden = c.unidades === 0 || estado.aberta;
  $("#barra-n").textContent = c.unidades;
  $("#barra-total").textContent = reais(c.subtotal);
  $("#abrir-pedido").setAttribute("aria-label", `Ver pedido: ${plural(c.unidades, "cookie", "cookies")}, ${reais(c.subtotal)}`);
  const nUlt = estado.ultimo ? Object.values(estado.ultimo).reduce((a, b) => a + b, 0) : 0;
  const atalho = estado.ultimo && c.unidades === 0 ? `<button class="atalho" type="button" data-acao="repetir">Repetir meu último pedido (${plural(nUlt, "cookie", "cookies")})</button>` : "";
  if ($("#atalhos").innerHTML !== atalho) $("#atalhos").innerHTML = atalho;
}

function totaisHtml(c) {
  const entrega = estado.modo === "entrega";
  return `<dl class="totais"><dt>${plural(c.unidades, "cookie", "cookies")}</dt><dd>${reais(c.subtotal)}</dd>` +
    (entrega ? `<dt>Entrega${c.sf === "ok" ? ` (cerca de ${kmTexto(frete.km)} km)` : ""}</dt><dd>${c.taxa !== null ? reais(c.taxa) : c.sf === "buscando" ? "Calculando…" : c.sf === "vazio" ? "Informe o endereço" : BAIRROS.length && !POR_KM ? "Escolha o bairro" : "A loja confirma"}</dd>` : `<dt>Retirada na loja</dt><dd>Grátis</dd>`) +
    `</dl>`;
}
const totalTexto = (c) => c.taxa === null ? reais(c.subtotal) + " + entrega" : reais(c.total);
function atualizarResumo() {
  const c = contas(), t = $("#totais"), b = $("#enviar");
  if (t) t.innerHTML = totaisHtml(c);
  if (b) b.href = linkZap();
  const tt = $("#total-valor"), er = $("#erro");
  if (tt) tt.textContent = totalTexto(c);
  if (er && estado.erro) {
    const f = faltando();
    estado.faltando = f.map((x) => x[0]);
    estado.erro = f.length ? "Falta preencher " + f.map((x) => x[1]).join(", ").replace(/, ([^,]*)$/, " e $1") + "." : "";
    er.textContent = estado.erro; er.hidden = !estado.erro;
  }
  const pv = $("#pedido-texto");
  if (pv) pv.textContent = textoPedido().replace(/\*/g, "");
}

function desenharSacola() {
  const c = contas(), s = situacao(), inv = (id) => estado.faltando.includes(id) ? ' aria-invalid="true"' : "";
  const topo = `<div class="sacola-topo"><h2>Seu pedido</h2><button class="fechar" type="button" data-acao="fechar-sacola" id="fechar-pedido" aria-label="Voltar aos sabores">${ICONE_X}</button></div>`;
  let corpo;
  if (!c.linhas.length) {
    corpo = `<div class="vazio">${cookieSvg()}<p>Nenhum cookie escolhido ainda. Toque na foto de um sabor para começar.</p><button class="botao medio" type="button" data-acao="fechar-sacola">Escolher sabores</button></div>`;
  } else {
    const falta = LOJA.pedidoMinimo ? LOJA.pedidoMinimo - c.subtotal : 0;
    const bairro = BAIRROS.length
      ? `<select id="bairro"${inv("bairro")}><option value="">Escolha o bairro</option>${BAIRROS.map((b) => `<option value="${esc(b.nome)}"${b.nome === estado.bairro ? " selected" : ""}>${esc(b.nome)} (${reais(b.taxa)})</option>`).join("")}</select>`
      : `<input id="bairro" autocomplete="address-level3" enterkeyhint="next" maxlength="50" value="${esc(estado.bairro)}"${inv("bairro")}>`;
    corpo = `<div class="bloco">
      <div class="linhas">${c.linhas.map((l) => `<div class="linha"><img src="${l.foto}" alt="" width="52" height="52"><div><div class="linha-nome">${esc(l.nome)}</div><div class="linha-preco">${reais(l.unit)} cada, ${reais(l.total)}</div></div>${passoHtml(l.id, l.qtd, true)}</div>`).join("")}</div>
      <div class="campo"><label for="obs">Observação (opcional)</label><textarea id="obs" rows="2" maxlength="200" placeholder="Ex.: é presente, tocar o interfone 12">${esc(estado.obs)}</textarea></div>

      <div class="campo"><label for="nome">Seu nome</label><input id="nome" autocomplete="name" autocapitalize="words" enterkeyhint="next" maxlength="60" value="${esc(estado.nome)}"${inv("nome")}></div>
      ${LOJA.entrega.retirada ? `<div class="troca" role="radiogroup" aria-label="Entrega ou retirada">
        <label><input type="radio" name="modo" id="modo-entrega" value="entrega"${estado.modo === "entrega" ? " checked" : ""}>Entrega</label>
        <label><input type="radio" name="modo" id="modo-retirada" value="retirada"${estado.modo === "retirada" ? " checked" : ""}>Retirada</label></div>` : ""}
      ${estado.modo === "entrega" ? `<div class="dupla"><div class="campo"><label for="rua">Rua</label><input id="rua" autocomplete="address-line1" enterkeyhint="next" maxlength="80" value="${esc(estado.rua)}"${inv("rua")}></div>
        <div class="campo"><label for="numero">Número</label><input id="numero" inputmode="numeric" enterkeyhint="next" maxlength="10" value="${esc(estado.numero)}"${inv("numero")}></div></div>
        <div class="campo"><label for="bairro">Bairro</label>${bairro}</div>
        <div class="campo"><label for="compl">Complemento ou referência (opcional)</label><input id="compl" enterkeyhint="done" maxlength="80" value="${esc(estado.compl)}"></div>`
        : `<p class="nota">${LOJA.entrega.enderecoRetirada ? "Retire em " + esc(LOJA.entrega.enderecoRetirada) + "." : "A loja combina o endereço e o horário da retirada pelo WhatsApp."}</p>`}

      <div class="campo"><span class="rotulo" id="rot-pag">Forma de pagamento</span>
        <div class="troca" role="radiogroup" aria-labelledby="rot-pag">
          <label><input type="radio" name="pag" id="pag-pix" value="pix"${estado.pagamento === "pix" ? " checked" : ""}>Pix</label>
          <label><input type="radio" name="pag" id="pag-cartao" value="cartao"${estado.pagamento === "cartao" ? " checked" : ""}>Cartão</label></div>
        <p class="nota">${estado.pagamento === "pix" ? "A loja envia a chave Pix na conversa." : "A loja envia o link de pagamento do cartão na conversa."}</p></div>

      <div id="totais">${totaisHtml(c)}</div>
      ${falta > 0 ? `<p class="aviso">O pedido mínimo é ${reais(LOJA.pedidoMinimo)}. Faltam ${reais(falta)}.</p>` : ""}
      <div class="fecho">
        <p class="erro" id="erro" role="alert"${estado.erro ? "" : " hidden"}>${esc(estado.erro)}</p>
        <div class="total-linha"><span>Total</span><span id="total-valor">${totalTexto(c)}</span></div>
        ${s && !s.aberto ? `<p class="aviso central">${esc(s.texto)}</p><span class="botao zap" aria-disabled="true">${ICONE_ZAP}Enviar pedido no WhatsApp</span>`
          : `<a class="botao zap" id="enviar" href="${esc(linkZap())}" target="_blank" rel="noopener" data-acao="enviar">${ICONE_ZAP}Enviar pedido no WhatsApp</a>`}
      </div>
      <div class="acoes">${estado.enviado ? `<p class="nota">O WhatsApp abre com o pedido escrito. É só tocar em enviar e aguardar a resposta da loja.${TEM_ZAP ? ` Não abriu? Copie o pedido e mande para <span class="numero">${esc(foneBonito())}</span>.` : ""}</p>
          <pre class="previa" id="pedido-texto">${esc(textoPedido().replace(/\*/g, ""))}</pre>
          <button class="botao vazado" type="button" data-acao="copiar" data-alvo="pedido-texto" data-feito="Pedido copiado">Copiar pedido</button>
          <button class="link" type="button" data-acao="novo">Começar outro pedido</button><span aria-hidden="true" style="height:0.75rem"></span>` : ""}</div></div>`;
  }
  $("#sacola").innerHTML = topo + corpo;
}

function desenhar() { desenharSacola(); desenharControles(); }

/* ------------------------------ ações ------------------------------- */
function mudarItem(id, delta) {
  const p = produto(id);
  if (!p || p.disponivel === false) return;
  if (delta > 0 && !aberta()) return;                       // loja fechada: não entra cookie novo no pedido
  const q = Math.max(0, Math.min(99, (estado.itens[id] || 0) + delta));
  if (q) estado.itens[id] = q; else delete estado.itens[id];
  estado.erro = ""; estado.faltando = [];
  salvar(); desenhar();
}
function abrirSacola(sim) {
  if (estado.aberta === sim) return;
  estado.aberta = sim;
  $("#sacola").hidden = !sim;
  $("#fundo").hidden = !sim;
  $("#pagina").inert = sim;
  document.body.classList.toggle("travado", sim);
  desenharControles();
  if (sim) { $("#sacola").scrollTop = 0; $("#fechar-pedido")?.focus({ preventScroll: true }); calcularFrete(); }
  else if (!$("#barra").hidden) $("#abrir-pedido").focus({ preventScroll: true });
}
async function copiar(botao) {
  const alvo = document.getElementById(botao.dataset.alvo);
  const texto = alvo.value !== undefined ? alvo.value : alvo.textContent;
  const original = botao.dataset.original || botao.textContent;
  botao.dataset.original = original;
  try { await navigator.clipboard.writeText(texto); botao.textContent = botao.dataset.feito; }
  catch (e) {
    const r = document.createRange(); r.selectNodeContents(alvo); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    botao.textContent = "Texto selecionado: copie pelo menu do aparelho";
  }
  setTimeout(() => { botao.textContent = original; }, 2500);
}

document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-acao]");
  if (!el) return;
  const a = el.dataset.acao;
  if (a === "mais") mudarItem(el.dataset.id, 1);
  else if (a === "menos") mudarItem(el.dataset.id, -1);
  else if (a === "abrir-sacola") abrirSacola(true);
  else if (a === "fechar-sacola") abrirSacola(false);
  else if (a === "copiar") copiar(el);
  else if (a === "repetir") { estado.itens = { ...estado.ultimo }; salvar(); desenhar(); }
  else if (a === "novo") { estado.itens = {}; estado.obs = ""; estado.enviado = false; estado.erro = ""; estado.faltando = []; estado.pedidoId = novoId(); salvar(); desenhar(); abrirSacola(false); }
  else if (a === "enviar") {
    if (!aberta()) { ev.preventDefault(); desenharStatus(); desenhar(); return; }      // fechou enquanto a pessoa preenchia
    const f = faltando(), minimo = LOJA.pedidoMinimo && contas().subtotal < LOJA.pedidoMinimo;
    const calculando = !f.length && POR_KM && estado.modo === "entrega" && situacaoFrete() === "buscando";
    if (calculando) { clearTimeout(tempoFrete); calcularFrete(); }
    if (f.length || minimo || calculando) {
      ev.preventDefault();
      estado.faltando = f.map((x) => x[0]);
      estado.erro = f.length ? "Falta preencher " + f.map((x) => x[1]).join(", ").replace(/, ([^,]*)$/, " e $1") + "." : calculando ? "Calculando o frete. Toque de novo em um instante." : "O pedido ainda não chegou ao valor mínimo.";
      desenharSacola();
      if (f.length) document.getElementById(f[0][0])?.focus();
      return;
    }
    el.href = linkZap();                       // garante a mensagem mais recente; o próprio link abre o WhatsApp
    estado.ultimo = { ...estado.itens }; estado.erro = ""; estado.faltando = []; salvar();
    if (!estado.enviado) { estado.enviado = true; setTimeout(desenharSacola, 400); }
  }
});
document.addEventListener("input", (ev) => {
  const t = ev.target;
  if (["obs", "nome", "rua", "numero", "bairro", "compl"].includes(t.id)) {
    estado[t.id] = t.value;
    if (t.getAttribute("aria-invalid") && t.value.trim()) t.removeAttribute("aria-invalid");
    salvar(); atualizarResumo();
    if (["rua", "numero", "bairro"].includes(t.id)) agendarFrete();
  }
});
document.addEventListener("change", (ev) => {
  const t = ev.target;
  if (t.name === "modo") { estado.modo = t.value; estado.erro = ""; estado.faltando = []; salvar(); desenhar(); document.getElementById("modo-" + t.value)?.focus(); }
  else if (["rua", "numero", "bairro"].includes(t.id)) { clearTimeout(tempoFrete); calcularFrete(); }     // saiu do campo: calcula já
  else if (t.name === "pag") { estado.pagamento = t.value; salvar(); desenharSacola(); document.getElementById("pag-" + t.value)?.focus(); }
});
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && estado.aberta) abrirSacola(false); });

desenharFixos();
desenhar();

// A loja abre e fecha sozinha pelo horário: confere a cada 30 s e quando a pessoa volta para a aba.
let estavaAberta = aberta();
function conferirHorario() {
  desenharStatus();
  const a = aberta();
  if (a !== estavaAberta) { estavaAberta = a; desenhar(); }
}
setInterval(conferirHorario, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) conferirHorario(); });
</script>
